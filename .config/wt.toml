# Worktrunk project config for terminal / non-Cursor parallel checkouts.
# In Cursor, prefer Cursor’s native worktrees (~/.cursor/worktrees/…) and
# .cursor/worktrees.json — see QUICKSTART.md.
# Install: mise install && wt config shell install
# App and infrastructure ports are derived once through Worktrunk hash_port and
# stored in ignored .env.worktree. Later manual edits are preserved.
# Each worktree starts with empty Compose volumes; demo data comes from the
# Go seed after Appwrite credentials exist.

[[pre-start]]
bootstrap = "bash scripts/worktree-bootstrap.sh"

[pre-remove]
purge = "bash scripts/worktree-compose.sh down-v"
