include:
  - path:
      - ./appwrite/docker-compose.appwrite.yaml
      - ./appwrite/docker-compose.worktree.yaml
    env_file:
      - ./appwrite/.env.appwrite.example

x-attesta-resource-labels: &attesta-resource-labels
  eu.forkbomb.attesta.managed: "true"
  eu.forkbomb.attesta.worktree: "${ATTESTA_WORKTREE_ROOT:-unknown}"
  eu.forkbomb.attesta.project: "${COMPOSE_PROJECT_NAME:-attesta}"
  eu.forkbomb.attesta.repository: "${ATTESTA_REPOSITORY_ID:-unknown}"

services:
  mongodb:
    image: mongo:7.0
    labels: *attesta-resource-labels
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.50.0
    labels: *attesta-resource-labels
    restart: unless-stopped
    command: ["server", "--config=/config/config.yaml"]
    ports:
      - "${CERBOS_PORT:-3592}:3592"
    volumes:
      - ../cerbos/policies:/policies
      - ../cerbos/config:/config

  mongo-express:
    image: mongo-express:1.0.2
    labels: *attesta-resource-labels
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      - mongodb

  mailpit:
    image: axllent/mailpit:v1.29.3
    labels: *attesta-resource-labels
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - default
      - appwrite

  attesta:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.local
    labels: *attesta-resource-labels
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      CERBOS_URL: http://cerbos:3592
      APPWRITE_ENDPOINT: http://appwrite/v1
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY:-}
      APPWRITE_INVITE_REDIRECT_URL: ${APPWRITE_INVITE_REDIRECT_URL:-http://localhost:${DOCKER_APP_PORT:-3030}/invite/accept}
      APPWRITE_RESET_REDIRECT_URL: ${APPWRITE_RESET_REDIRECT_URL:-http://localhost:${DOCKER_APP_PORT:-3030}/reset/confirm}
      APPWRITE_VERIFY_REDIRECT_URL: ${APPWRITE_VERIFY_REDIRECT_URL:-http://localhost:${DOCKER_APP_PORT:-3030}/verify/confirm}
      APPWRITE_ORG_ASSETS_BUCKET: ${APPWRITE_ORG_ASSETS_BUCKET:-org-assets}
      # Cloudflare's always-pass test pair. Environment values may override these defaults.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: attesta@localhost
    ports:
      - "${DOCKER_APP_PORT:-3030}:3000"
    networks:
      - default
      - appwrite
    depends_on:
      - mongodb
      - cerbos
      - appwrite

volumes:
  mongodb_data:
    driver: local
    labels: *attesta-resource-labels

networks:
  default:
    labels: *attesta-resource-labels
