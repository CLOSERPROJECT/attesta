name: 🧪 Tests

# Every pull request into either branch reports this check, including
# documentation-only changes, so a required check never stays pending.
on:
  pull_request:
    branches:
      - master
      - feat/org-config-as-stream-v2
  push:
    branches:
      - master
      - feat/org-config-as-stream-v2

jobs:
  test:
    name: ⏳ Run tests
    runs-on: ubuntu-latest
    steps:
      - name: 🔔 Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: 🥢 Set up go@1.25.5, bun, and task@latest
        uses: jdx/mise-action@v3
      - name: 🧪 Run tests (Go cover + SPA vitest)
        run: COVER_MIN=90.0 task cover
        shell: bash
