            required:
              - RAEE commenti
              - Codice rifiuto (EER)
              - Choice field
            title: Form title
          uiSchema:
            Choice field:
              ui:components:
                stringField: enumField
                selectWidget: radioWidget
              ui:options:
                useLabel: false
      title: Collection of PV modules
