                enum:
                  - 20.01.23* (R1 Frigo)
                  - 20.01.36 (R2 grandi bianchi)
                  - 20.01.35* (R3 Monitor)
                  - 20.01.21* (R5 Neon/Lampade)
                  - 20.01.36 (R4 tastiere/PC)
