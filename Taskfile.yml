version: "3"

tasks:
  default:
    desc: Start services and show status.
    cmds:
      - task: start

  submodule:init:
    desc: Initialize git submodules required by embedded assets.
    cmds:
      - git submodule update --init --recursive

  worktree:bootstrap:
    desc: Copy ignored dev state and initialize this worktree's ports.
    cmds:
      - bash scripts/worktree-bootstrap.sh {{.CLI_ARGS}}

  start:
    desc: Bring up this worktree's isolated infrastructure stack.
    cmds:
      - task: worktree:bootstrap
      - bash scripts/worktree-compose.sh up

  start:build:
    desc: Rebuild and bring up this worktree's isolated infrastructure stack.
    cmds:
      - task: submodule:init
      - task: worktree:bootstrap
      - bash scripts/worktree-compose.sh up --build

  start:docker:
    desc: Bring up this worktree's full stack, including the containerized Attesta app.
    cmds:
      - task: worktree:bootstrap
      - bash scripts/worktree-compose.sh up-app

  start:docker:build:
    desc: Rebuild and bring up this worktree's full containerized stack.
    cmds:
      - task: submodule:init
      - task: worktree:bootstrap
      - bash scripts/worktree-compose.sh up-app --build

  stop:
    desc: Remove this worktree's containers and networks (keeps volumes).
    cmds:
      - bash scripts/worktree-compose.sh down

  reset:
    desc: Remove this worktree's stack, including its volumes.
    cmds:
      - bash scripts/worktree-compose.sh down-v

  purge:
    desc: Purge this worktree's volumes and coordinated data bundle after confirmation.
    cmds:
      - |
          read -r -p "This will delete this worktree's MongoDB and Appwrite data. Type PURGE to continue: " confirm
          if [ "$confirm" = "PURGE" ]; then
            bash scripts/worktree-compose.sh down-v
            bash scripts/worktree-data.sh forget
          else
            echo "Purge cancelled."
          fi

  worktree:gc:
    desc: Preview Attesta Docker resources orphaned by removed worktrees.
    cmds:
      - bash scripts/worktree-gc.sh

  worktree:gc:apply:
    desc: Remove Attesta Docker resources confirmed orphaned by worktree:gc.
    cmds:
      - bash scripts/worktree-gc.sh --apply

  status:
    desc: Show this worktree's service status.
    cmds:
      - bash scripts/worktree-compose.sh ps

  logs:
    desc: Tail this worktree's Docker logs.
    cmds:
      - bash scripts/worktree-compose.sh logs

  mongo-ping:
    desc: Ping this worktree's MongoDB service.
    cmds:
      - bash scripts/worktree-compose.sh mongo-ping

  dev:
    desc: Hot reload backend + frontend with this worktree's isolated stack.
    cmds:
      - task: start
      - |
          bash -c '
          set -euo pipefail
          task dev:server &
          server_pid=$!
          task dev:web &
          web_pid=$!
          wait $server_pid $web_pid
          '

  dev:server:
    desc: Hot reload Go server (ports from .env.worktree; macOS-safe restart).
    cmds:
      - task: goa:generate
      - sh -c 'cd server && GOCACHE=${GOCACHE:-/tmp/gocache-attesta} go mod tidy'
      # --server-only: do not kill vite (task:dev starts server+web in parallel)
      - bash deployment/scripts/dev-stop-local.sh --server-only
      - sh -c 'cd server && go install github.com/air-verse/air@latest'
      - |
          bash -c '
          set -euo pipefail
          source deployment/scripts/dev-env.sh
          bash deployment/scripts/dev-stop-local.sh --ports-only
          cd server
          bin="$(go env GOBIN)"
          if [ -z "$bin" ]; then bin="$(go env GOPATH)/bin"; fi
          "$bin/air" -c .air.toml
          '

  dev:web:
    desc: Vite dev server (HMR) on VITE_PORT from .env.worktree.
    cmds:
      - bash deployment/scripts/dev-stop-local.sh --web-only
      - sh -c 'cd web && npm install'
      - |
          bash -c '
          set -euo pipefail
          source deployment/scripts/dev-env.sh
          cd web
          npm run dev -- --port "$VITE_PORT" --strictPort
          '

  run:server:
    desc: Generate Goa artifacts, sync Go deps, and run the backend on the configured worktree port.
    cmds:
      - task: worktree:bootstrap
      - task: goa:generate
      - sh -c 'cd server && GOCACHE=${GOCACHE:-/tmp/gocache-attesta} go mod tidy'
      - |
          bash -c '
          set -euo pipefail
          source deployment/scripts/dev-env.sh
          cd server
          GOCACHE=${GOCACHE:-/tmp/gocache-attesta} go run ./cmd/server
          '

  goa:generate:
    desc: Generate Goa code and OpenAPI spec.
    cmds:
      - task: submodule:init
      - sh -c 'cd server && GOCACHE=${GOCACHE:-/tmp/gocache-attesta} go generate ./design'

  goa:generate:all:
    desc: Regenerate Goa artifacts and verify Go build graph.
    cmds:
      - task: goa:generate
      - sh -c 'cd server && GOCACHE=${GOCACHE:-/tmp/gocache-attesta} go test ./...'

  test:
    desc: Run backend unit tests.
    cmds:
      - task: test:worktree
      - task: css:lint
      - task: goa:generate
      - sh -c 'cd server && GOCACHE=${GOCACHE:-/tmp/gocache-attesta} go test $(go list ./... | grep -v "/gen")'

  test:worktree:
    desc: Run worktree lifecycle and Compose safety tests.
    cmds:
      - bash deployment/scripts/dev-lib_test.sh
      - bash deployment/scripts/worktree-env_test.sh
      - bash deployment/scripts/dev-env_test.sh
      - bash deployment/scripts/worktree-bootstrap_test.sh
      - bash deployment/scripts/worktree-data_test.sh
      - bash deployment/scripts/worktree-compose_test.sh
      - bash deployment/scripts/worktree-gc_test.sh
      - bash deployment/scripts/restore-appwrite-seed_test.sh

  css:lint:
    desc: CSS lint (template inline styles + breakpoint guard + stylelint).
    cmds:
      - bash deployment/scripts/check-template-inline-styles.sh
      - bash deployment/scripts/check-css-breakpoints.sh
      - cd web && { [ -d node_modules ] || npm ci; }
      - cd web && npm run lint:css

  templates:fmt:
    desc: Format Go html/template files under server/templates (djLint golang profile).
    cmds:
      - bash scripts/djlint.sh server/templates --reformat --quiet

  templates:check:
    desc: Check Go html/template formatting under server/templates (djLint).
    cmds:
      - bash scripts/djlint.sh server/templates --check

  templates:lint:
    desc: Lint Go html/template files under server/templates (djLint).
    cmds:
      - bash scripts/djlint.sh server/templates --lint

  cover:
    desc: Run backend tests with a 90% coverage gate.
    cmds:
      - task: test:worktree
      - task: css:lint
      - task: goa:generate
      - |
          sh -c '
          set -eu
          cd server
          min=${COVER_MIN:-90.0}
          GOCACHE=${GOCACHE:-/tmp/gocache-attesta} go test $(go list ./... | grep -v "/gen") -coverprofile=coverage.out
          total=$(GOCACHE=${GOCACHE:-/tmp/gocache-attesta} go tool cover -func=coverage.out | awk "/^total:/ {gsub(/%/, \"\", \$3); print \$3}")
          echo "total coverage: ${total}%"
          awk -v total="$total" -v min="$min" "BEGIN { if ((total+0) < (min+0)) { printf(\"coverage gate failed (< %.1f%%)\\n\", min); exit 1 } }"
          '

  seed:categories:
    desc: Full-replace Mongo taxonomy from server/config/categories.yaml.
    dir: server
    cmds:
      - go run ./cmd/server seed-categories {{.CLI_ARGS}}

  seed:catalog-streams:
    desc: Full-replace Formata catalog streams (1–3 per taxonomy leaf) for local/dev.
    dir: server
    cmds:
      - go run ./cmd/server seed-catalog-streams {{.CLI_ARGS}}

  seed:instances:
    desc: Replace Mongo process instances for every runtime-catalog stream with a realistic demo mix.
    dir: server
    cmds:
      - go run ./cmd/server seed-instances {{.CLI_ARGS}}
