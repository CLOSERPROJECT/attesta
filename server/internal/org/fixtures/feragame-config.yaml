# Attesta Feragame demo fixture (steps / substeps).
# Single source of truth: embedded by Go (LoadFeragameConfigFixture) and imported by SPA tests.
# Plant tree: intake truckArrive → register (many) → weightCheck;
# lot_processing startLot → weigh / markProgress / containerReg → closeLot → lock (DPP).
#
# Authored tasks are ordered lists with required unique id (not maps).
# Lot session status is open|fullyProcessed only (no parked / turn bookends).
# lot_processing is leaf-only (submit once|many + readyWhen); no Task groups / unlockFrom.

id: feragame-config
org: feragame
stream:
    key: recycling
    title: Lavorazione rifiuti
    description: Ingresso camion e lavorazione lotti
    categorySlug: recycling-and-recovery
    subCategorySlug: flat-screen-displays
    instance:
        job: intake
    steps:
        - job: intake
        - job: lot_processing
          each:
              entity: lot
              where: truckId = $stream.id
domain:
    entities:
        truck:
            fields: [truckWeight, lastScaleReading, checkedTruckWeight, checkedLotSum]
        lot:
            fields: [client, clientProgressive, numeroFir, wasteCode, palletCount, netWeight, truckId, notes, status, locked, issued]
        pallet:
            # Per-row tare + IR/NIR at weigh time.
            fields: [lotId, weight, tareKind, idoneita, panelCount, progress]
        # weight = booked kg for sourceLotId; incomplete freeze; secondarySourceLotId from continued prior.
        container:
            fields: [weight, material, incomplete, sourceLotId, secondarySourceLotId]
# Stable catalog vocabulary for exprs ($catalogs.*). Schema enums stay authored until codegen.
catalogs:
    clients:
        CO: CO
        DA: DA
        DI: DI
        EC: EC
        EF: EF
        EM: EM
        ER: ER
        HI: HI
        MI: MI
        MO: MO
        NI: NI
        PR: PR
        RE: RE
        SA: SA
        SK: SK
    tareKinds:
        industrial: 25
        euro: 20
    materials:
        - {key: polvereDiVetro, label: Polvere di vetro}
        - {key: granellaDiVetro, label: Granella di vetro}
        - {key: granellaDiVetro2, label: Granella di vetro 2}
        - {key: polvereDiSilicio, label: Polvere di silicio}
        - {key: plastica, label: Plastica}
        - {key: alluminio, label: Alluminio}
        - {key: sopravaglio, label: Sopravaglio}
        - {key: polvereDiAspirazione, label: Polvere di aspirazione}
# QR resolve (topbar Scan / cold ?entityId=). Encode stays on intake/register http body.
qr:
    rules:
        - id: lot-pallet-weigh
          when: >-
            $type($scan.entityId) = "string" and $length($trim($scan.entityId)) > 0
          match:
            jobId: lot_processing
            taskId: weigh
          # jsonata-go: $exists($lookup(...)) is true for missing keys; probe a field / sift instead.
          eligible: |
            (
              $count($sift($domain.pallet, function($v, $k){$k = $scan.entityId})) = 1
              and $not($exists($lookup($domain.pallet, $scan.entityId).weight))
              and $lookup($domain.lot, $lookup($domain.pallet, $scan.entityId).lotId).status = "open"
            )
          seed:
            palletId: $scan.entityId
          messages:
            onZero: Nessuna pesatura disponibile per questo bancale
            onMany: "Più destinazioni possibili: scegli il lotto giusto dalla lista lavori"
            onIneligible: Bancale non pesabile (assente, già pesato, o lotto non aperto)
# Org DPP scheme (one shape per Config version). Lock leaf opts in via onSubmit.passport.
# After YAML shape changes: task seed:feragame-config (empty Domain). Soft Config refresh: seed:feragame-config -- --keep-domain. Staged Domain: seed:feragame-domain. With Appwrite: seed:feragame-identity / seed:feragame-full. Full-stack: task seed -- --replace.
dpp:
    subject:
        entity: lot
    identity:
        gtin: '"9506000134352"'
        lot: '$lookup($domain.lot, $subjectId).numeroFir'
        serial: '$subjectId'
        productName: '"Carico Feragame"'
        description: >-
            (
              $lot := $lookup($domain.lot, $subjectId);
              $client := $lookup($catalogs.clients, $lot.client);
              $client & " — CER " & $lot.wasteCode
            )
    snapshot:
        # dataReport-shaped; Lock Load chrome injects this expr live (same freeze on Commit).
        # No workingDay/shift Domain joins (calendar is not Domain machinery).
        expr: |-
            (
              $lot := $lookup($domain.lot, $subjectId);
              $truck := $lookup($domain.truck, $lot.truckId);
              $palletMap := $sift($domain.pallet, function($v){$v.lotId = $subjectId});
              $containerMap := $sift($domain.container, function($v){$v.sourceLotId = $subjectId});
              $palletIds := $sort($keys($palletMap));
              $containerIds := $sort($keys($containerMap));
              $pallets := $count($palletIds) = 0 ? [] : $append([], $map($palletIds, function($id){$merge([$lookup($palletMap, $id), {"id": $id}])}));
              $containers := $count($containerIds) = 0 ? [] : $append([], $map($containerIds, function($id){$merge([$lookup($containerMap, $id), {"id": $id}])}));
              $kg := function($v){ $type($v) = "number" ? $string($v) : null };
              $str := function($v){ $type($v) = "string" and $length($trim($v)) > 0 ? $trim($v) : null };
              $row := function($label, $value){ {"label": $label, "value": $value, "error": null, "tone": null} };
              $palletRows := $count($pallets) = 0 ? [] : $map($pallets, function($p){(
                $row(
                  "Bancale " & $str($p.id),
                  $kg($p.weight) & ($exists($p.progress) ? " (" & $string($p.progress) & ")" : "")
                )
              )});
              $containerRows := $count($containers) = 0 ? [] : $map($containers, function($c){(
                $row(
                  $str($c.material) ? $str($c.material) : "Contenitore",
                  $kg($c.weight) & ($c.incomplete = true ? " (incompleto)" : "")
                )
              )});
              {
                "title": "DPP carico",
                "subjectId": $subjectId,
                "lot": $lot,
                "truck": $truck,
                "pallets": $pallets,
                "containers": $containers,
                "rows": $append(
                  [
                    $row("Carico", $subjectId),
                    $row("Cliente", $lookup($catalogs.clients, $lot.client)),
                    $row("FIR", $str($lot.numeroFir)),
                    $row("CER", $str($lot.wasteCode)),
                    $row("Netto lotto (kg)", $kg($lot.netWeight)),
                    $row("Camion", $str($lot.truckId)),
                    $row("Peso lordo camion (kg)", $kg($truck.truckWeight))
                  ],
                  $append($palletRows, $containerRows)
                )
              }
            )
steps:
    intake:
        repeatable: true
        title: Ingresso
        startLabel: Nuovo camion
        color: '#ea580c'
        instanceId: $truck.id
        label: $truck.id
        substeps:
            - id: truckArrive
              roles: [administration]
              schema:
                type: object
                title: Registrazione camion
                required: [truckWeight]
                properties:
                    truckWeight: {type: number, exclusiveMinimum: 0, title: Peso lordo camion}
              uiSchema:
                ui:options:
                    order: [truckWeight]
              onSubmit:
                transform:
                    - op: mint
                      entity: truck
                      as: truck
                      id: >-
                        $substring($replace($today, "-", ""), 2) & "-" & $string($count($domain.truck.*) + 1)
                      set:
                        truckWeight: $.truckWeight
                        lastScaleReading: $.truckWeight
            - id: register
              roles: [administration]
              submit: many
              title: Codici FIR
              onCommit:
                  navigation: stay
              readyWhen: >-
                (
                  $count($domain.submissions[jobId = "intake" and taskId = "truckArrive" and jobInstanceId = $instance.id]) >= 1
                  and $count($domain.submissions[jobId = "intake" and taskId = "weightCheck" and jobInstanceId = $instance.id]) = 0
                )
              schema:
                type: object
                required: [client, numeroFir, palletCount, truckWeightAfter]
                properties:
                    client:
                        type: string
                        title: Cliente
                        enum: [CO, DA, DI, EC, EF, EM, ER, HI, MI, MO, NI, PR, RE, SA, SK]
                    wasteCode:
                        type: string
                        title: Codice CER
                        enum: ['160214']
                        default: '160214'
                    numeroFir: {type: string, minLength: 1, title: Numero FIR}
                    palletCount: {type: integer, minimum: 1, title: Numero di bancali}
                    truckWeightAfter: {type: number, exclusiveMinimum: 0, title: Peso camion dopo scarico}
                    notes: {type: string, title: Note}
              uiSchema:
                ui:options:
                    order:
                        [
                            client,
                            progressiveNumber,
                            numeroFir,
                            palletCount,
                            truckWeightBefore,
                            truckWeightAfter,
                            lotNetWeight,
                            notes,
                            wasteCode,
                        ]
                    layout: cols-3
                client:
                    ui:options:
                        enumNames: [CO, DA, DI, EC, EF, EM, ER, HI, MI, MO, NI, PR, RE, SA, SK]
                numeroFir:
                    ui:options:
                        layoutNewRow: true
                wasteCode:
                    ui:options:
                        enumNames: ['16.02.14']
                notes:
                    ui:components:
                        textWidget: textareaWidget
                    ui:options:
                        layoutSpan: true
              chrome:
                progressiveNumber:
                    kind: readonly
                    title: Progressivo cliente
                    after: client
                    expr: >-
                        (
                          $dateStamp := $substring($replace($today, '-', ''), 2);
                          $prefix := $.client & '-' & $dateStamp & '-';
                          $count($filter($keys($domain.lot), function($k){ $substring($string($k), 0, $length($prefix)) = $prefix })) + 1
                        )
                truckWeightBefore:
                    kind: readonly
                    title: Peso camion (prima)
                    before: truckWeightAfter
                    layoutNewRow: true
                    expr: >-
                        $lookup($domain.truck, $instance.id).lastScaleReading
                lotNetWeight:
                    kind: readonly
                    title: Peso netto lotto
                    after: truckWeightAfter
                    placeholder: Calcolato dopo il peso camion…
                    expr: >-
                        (
                          $prev := $lookup($domain.truck, $instance.id).lastScaleReading;
                          $type($prev) = 'number' and $type($.truckWeightAfter) = 'number' ? $prev - $.truckWeightAfter : null
                        )
              onSubmit:
                transform:
                    - op: mint
                      entity: lot
                      as: lot
                      id: >-
                        (
                          $dateStamp := $substring($replace($today, '-', ''), 2);
                          $prefix := $.client & '-' & $dateStamp & '-';
                          $n := $count($filter($keys($domain.lot), function($k){ $substring($string($k), 0, $length($prefix)) = $prefix })) + 1;
                          $.client & '-' & $dateStamp & '-' & $string($n)
                        )
                      set:
                        client: $.client
                        clientProgressive: >-
                          (
                            $dateStamp := $substring($replace($today, '-', ''), 2);
                            $prefix := $.client & '-' & $dateStamp & '-';
                            $count($filter($keys($domain.lot), function($k){ $substring($string($k), 0, $length($prefix)) = $prefix })) + 1
                          )
                        numeroFir: $.numeroFir
                        wasteCode: $.wasteCode
                        palletCount: $.palletCount
                        truckId: $instance.id
                        notes: $.notes
                        netWeight: >-
                          $lookup($domain.truck, $instance.id).lastScaleReading - $.truckWeightAfter
                    - op: mintMany
                      entity: pallet
                      count: $.palletCount
                      id: "$lot.id & '.' & $string($index + 1)"
                      set:
                        lotId: $lot.id
                    - op: patch
                      entity: truck
                      id: $instance.id
                      set:
                        lastScaleReading: $.truckWeightAfter
                http:
                    - method: '"POST"'
                      url: '"/effects/labels"'
                      label: '"Stampa etichette"'
                      action: link
                      body: >-
                        {

                          "lotId": $lot.id,
                          "date": $substring($replace($today, '-', ''), 2),
                          "client": $.client,
                          "clientProgressive": $lot.clientProgressive,
                          "numeroFir": $.numeroFir,
                          "wasteCode": $.wasteCode,
                          "palletCount": $.palletCount,
                          "netWeight": $lot.netWeight,
                          "labels": [$each(
                            $sift($domain.pallet, function($v){$v.lotId = $lot.id}),
                            function($v, $id){{ "id": $id, "client": $.client, "qr": $qrEndpoint & "?entityId=" & $id }}
                          )]
                        }
                    - method: '"POST"'
                      url: '"/effects/register-csv"'
                      label: '"Scarica CSV registrazione"'
                      action: download
                      body: >-
                        {

                          "client": $.client,
                          "numeroFir": $.numeroFir,
                          "palletCount": $.palletCount,
                          "truckWeightAfter": $.truckWeightAfter,
                          "netWeight": $lot.netWeight,
                          "notes": $.notes,
                          "lotId": $lot.id,
                          "truckId": $instance.id,
                          "palletIds": [$each(
                            $sift($domain.pallet, function($v){$v.lotId = $lot.id}),
                            function($v, $k){$k}
                          )]
                        }
            - id: weightCheck
              roles: [administration]
              readyWhen: >-
                (
                  $count($domain.submissions[jobId = "intake" and taskId = "truckArrive" and jobInstanceId = $instance.id]) >= 1
                  and $count($domain.lot.*[truckId = $instance.id]) >= 1
                )
              schema:
                type: object
                title: Controllo camion vs lotti
                required: [checkedTruckWeight, checkedLotSum]
                properties:
                    checkedTruckWeight: {type: number, exclusiveMinimum: 0, title: Peso camion verificato}
                    checkedLotSum: {type: number, exclusiveMinimum: 0, title: Somma pesi netti lotti verificata}
              uiSchema:
                ui:options:
                    order: [checkedTruckWeight, checkedLotSum]
              chrome:
                registeredData:
                    kind: dataReport
                    title: Dati registrati
                    before: checkedTruckWeight
                    expr: |-
                        (
                          $truck := $lookup($domain.truck, $instance.id);
                          $gross := $truck.truckWeight;
                          $lotSum := $sum($append([], $domain.lot.*[truckId=$instance.id].netWeight));
                          $tare := $truck.lastScaleReading;
                          $m := $max([$gross - $tare, $lotSum]);
                          $pct := $m = 0 ? 0 : 100 * $min([$gross - $tare, $lotSum]) / $m;
                          $tone := $pct >= 98 ? "green" : $pct >= 90 ? "warning" : "danger";
                          $kg := function($v){ $type($v) = "number" ? $string($v) : null };
                          {
                            "value": null,
                            "error": null,
                            "rows": [
                              {"label": "Peso lordo camion", "value": $kg($gross), "error": null, "tone": null},
                              {"label": "Ultima lettura (tara)", "value": $kg($tare), "error": null, "tone": null},
                              {"label": "Σ netti lotti", "value": $kg($lotSum), "error": null, "tone": null},
                              {"label": "Corrispondenza %", "value": $string($pct), "error": null, "tone": $tone}
                            ]
                          }
                        )
                currentOperator:
                    kind: readonly
                    title: Operatore corrente
                    expr: $operator.displayName
                    after: checkedLotSum
              onSubmit:
                transform:
                    - op: patch
                      entity: truck
                      id: '$instance.id'
                      set:
                        checkedTruckWeight: $.checkedTruckWeight
                        checkedLotSum: $.checkedLotSum
    lot_processing:
        repeatable: true
        title: Lavorazione
        startLabel: Apri lotto
        color: '#0284c7'
        instanceId: $.lotId
        label: "'Lotto ' & $.lotId"
        substeps:
            - id: startLot
              roles: [logistic]
              # Demo drift (#365): one open lot per truck ($stream.id), not plant-wide.
              # Revert: drop truckId = $stream.id filters; restore plant-wide open count.
              readyWhen: >-
                (
                  $count($domain.lot.*[truckId = $stream.id and status = "open"]) = 0
                  and $count($domain.lot.*[truckId = $stream.id and $not(status = "fullyProcessed") and $not(status = "open")]) >= 1
                )
              blockedReason: >-
                (
                  $openId := $keys($sift($domain.lot, function($v){$v.status = "open" and $v.truckId = $stream.id}))[0];
                  $exists($openId)
                    ? 'Linea occupata: lotto ' & $openId & ' (camion ' & $lookup($domain.lot, $openId).truckId & ')'
                    : ''
                )
              enumReads:
                lotId: lots
              reads:
                lots:
                    entity: lot
                    where: $not(status = "fullyProcessed") and $not(status = "open") and truckId = $stream.id
                    key: id
              schema:
                type: object
                title: Apri lotto
                required: [lotId]
                properties:
                    lotId:
                        type: string
                        title: Lotto
              uiSchema:
                lotId:
                    ui:components:
                        stringField: enumField
              onSubmit:
                transform:
                    - op: patch
                      entity: lot
                      id: $.lotId
                      set:
                        status: '"open"'
            - id: weigh
              roles: [line]
              submit: many
              title: Pesa bancale
              onCommit:
                  navigation: stay
              readyWhen: >-
                (
                  $lookup($domain.lot, $instance.id).status = "open"
                  and $count($domain.pallet.*[
                    lotId = $instance.id
                    and $not($exists(weight))
                  ]) >= 1
                )
              reads:
                pallets:
                    entity: pallet
                    where: >-
                      lotId = $instance.id
                      and $not($exists(weight))
                    key: id
              enumReads:
                palletId: pallets
              derived:
                panelCount:
                    overridable: true
                    expr: |
                        (
                          $avg := $data.averagePanelWeight;
                          $kind := $data.tareKind;
                          $tare := $kind = 'custom'
                            ? $data.customTareWeight
                            : $lookup($catalogs.tareKinds, $kind);
                          $w := $data.weight;
                          $avg > 0 and $type($tare) = "number" and $type($w) = "number"
                            ? $floor(($w - $tare) / $avg)
                            : undefined
                        )
              schema:
                type: object
                title: Pesa bancale
                required: [palletId, averagePanelWeight, tareKind, weight, idoneita]
                properties:
                    palletId: {type: string, title: Bancale}
                    averagePanelWeight:
                        type: number
                        exclusiveMinimum: 0
                        title: Peso medio pannello (kg)
                        default: 20
                    tareKind:
                        type: string
                        title: Tara
                        enum: [industrial, euro, custom]
                        default: industrial
                    customTareWeight:
                        type: number
                        exclusiveMinimum: 0
                        title: Tara personalizzata (kg)
                    weight: {type: number, exclusiveMinimum: 0, title: Peso}
                    idoneita:
                        type: string
                        title: IR / NIR
                        enum: [NIR, IR]
                        default: NIR
                    panelCount: {type: number, title: Pannelli}
              uiSchema:
                ui:options:
                    order:
                        [palletId, weight, averagePanelWeight, tareKind, customTareWeight, idoneita, panelCount]
                    layout: cols-2
                tareKind:
                    ui:options:
                        enumNames: ['industriale (25 kg)', 'euro (20 kg)', 'personalizzato']
                idoneita:
                    ui:options:
                        enumNames: [NIR, IR]
                panelCount:
                    ui:field: derivedLeaf
                    ui:options:
                        layoutSpan: true
              onSubmit:
                transform:
                    - op: patch
                      entity: pallet
                      id: $.palletId
                      set:
                        weight: $.weight
                        tareKind: $.tareKind
                        idoneita: $.idoneita
                        panelCount: $.panelCount
            - id: markProgress
              roles: [line]
              submit: many
              title: Segna avanzamento
              onCommit:
                  navigation: stay
              readyWhen: >-
                (
                  $lookup($domain.lot, $instance.id).status = "open"
                  and $count($domain.pallet.*[
                    lotId = $instance.id
                    and $exists(weight)
                    and $not(progress = 'done')
                  ]) >= 1
                )
              dynamicProperties:
                progress:
                    read: rows
              reads:
                rows:
                    entity: pallet
                    where: >-
                      lotId = $instance.id
                      and $exists(weight)
                      and $not(progress = 'done')
                    key: id
              schema:
                type: object
                title: Segna avanzamento
                properties:
                    progress:
                        type: object
                        additionalProperties:
                            enum: [partial, done]
              uiSchema:
                progress:
                    ui:field: mapTable
                    ui:options:
                        expandable: false
                        columns: {id: Bancale, value: Avanzamento}
                    additionalProperties:
                        ui:options:
                            enumNames: [Parziale, Fatto]
                            # U+2013 — empty / stock-clearable trigger; Go expands to shadcn4*
                            placeholder: –
              onSubmit:
                transform:
                    - op: patchEach
                      entity: pallet
                      set:
                        progress: $value
            - id: containerReg
              roles: [logistic]
              submit: many
              title: Registrazione contenitori
              onCommit:
                  navigation: stay
              readyWhen: >-
                $lookup($domain.lot, $instance.id).status = "open"
              derived:
                continuesContainerId:
                    expr: >-
                        (
                          $key := $data.material;
                          $type($key) != "string" or $length($trim($key)) = 0 ? undefined : (
                            $label := $catalogs.materials[key=$key].label;
                            $open := $sift($domain.container, function($v){$v.incomplete = true and $v.material = $label});
                            $ids := $keys($open);
                            $count($ids) = 0 ? undefined : $sort($ids)[0]
                          )
                        )
              schema:
                type: object
                title: Registrazione contenitori
                required: [material, weight]
                properties:
                    material:
                        type: string
                        title: Materiale
                        enum: [polvereDiVetro, granellaDiVetro, granellaDiVetro2, polvereDiSilicio, plastica, alluminio, sopravaglio, polvereDiAspirazione]
                    weight: {type: number, exclusiveMinimum: 0, title: Peso}
                    incomplete:
                        type: boolean
                        title: Incompleto
                        default: false
                    continuesContainerId:
                        type: string
              uiSchema:
                ui:options:
                    order: [material, weight, incomplete, continuesContainerId]
                material:
                    ui:components:
                        selectWidget: radioTilesWidget
                    ui:options:
                        enumNames: [Polvere di vetro, Granella di vetro, Granella di vetro 2, Polvere di silicio, Plastica, Alluminio, Sopravaglio, Polvere di aspirazione]
                continuesContainerId:
                    ui:components:
                        stringField: hiddenField
              chrome:
                priorWeight:
                    kind: readonly
                    title: Peso precedente
                    after: material
                    hideIfNull: true
                    expr: >-
                        (
                          $key := $.material;
                          $type($key) != "string" or $length($trim($key)) = 0 ? null : (
                            $label := $catalogs.materials[key=$key].label;
                            $open := $sift($domain.container, function($v){$v.incomplete = true and $v.material = $label});
                            $ids := $keys($open);
                            $count($ids) = 0 ? null : $lookup($open, $sort($ids)[0]).weight
                          )
                        )
              onSubmit:
                transform:
                    - op: bind
                      expr: >-
                        (
                          $key := $.material;
                          $label := $catalogs.materials[key=$key].label;
                          $cid := $.continuesContainerId;
                          $prior := $type($cid) = "string" and $length($trim($cid)) > 0 ? $lookup($domain.container, $cid) : null;
                          $merge([
                            {
                              "weight": $prior ? $.weight - $prior.weight : $.weight,
                              "material": $label,
                              "incomplete": $.incomplete = true,
                              "sourceLotId": $instance.id,
                              "supersede": $prior ? {$cid: true} : {}
                            },
                            $prior ? {"secondarySourceLotId": $prior.sourceLotId} : {}
                          ])
                        )
                    - op: mint
                      entity: container
                      id: "'C-' & $string($count($domain.container.*) + 1)"
                      set:
                        weight: $.weight
                        material: $.material
                        incomplete: $.incomplete
                        sourceLotId: $.sourceLotId
                        secondarySourceLotId: $.secondarySourceLotId
                    - op: bind
                      expr: $.supersede
                    - op: patchEach
                      entity: container
                      set:
                        incomplete: false
            - id: closeLot
              roles: [logistic]
              submit: many
              title: Chiudi lotto
              onCommit:
                  navigation: stay
              readyWhen: >-
                (
                  $lookup($domain.lot, $instance.id).status = "open"
                  and (
                    $pallets := $domain.pallet.*[lotId = $instance.id];
                    $count($pallets) > 0
                    and $count($pallets[$exists(weight) and progress = "done"]) = $count($pallets)
                  )
                )
