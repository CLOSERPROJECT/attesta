# Attesta Feragame demo fixture (steps / substeps).
# Single source of truth: embedded by Go (LoadFeragameConfigFixture) and imported by SPA tests.
# Plant tree: intake truckArrive → lots group → weightCheck; line openTurno → palletWeight group → …
#
# Authored tasks are ordered lists with required unique id (not maps).
# openTurno is a Job-start mint leaf (date+turno); engine cannot startingNew on a group-first Job.

id: feragame-config
org: feragame
domain:
    entities:
        truck:
            fields: [date, turno, truckWeight, lastScaleReading, checkedTruckWeight, checkedLotSum]
        load:
            fields: [client, clientProgressive, numeroFir, wasteCode, palletCount, netWeight, truckId, notes]
        pallet:
            # Per-row tare + IR/NIR at weigh time.
            fields: [loadId, weight, tareKind, idoneita, panelCount, progress]
        # C5/C6: weight, material, primary load; dual rows add secondarySourceLoadId (no secondaryWeight).
        container:
            fields: [weight, material, sourceLoadId, secondarySourceLoadId]
# Stable catalog vocabulary for exprs ($catalogs.*). Schema enums stay authored until codegen.
catalogs:
    clients:
        NO: Nord
        SU: Sud
    turni:
        1st: 1°
        2nd: 2°
        3rd: 3°
        whole-day: giornata intera
    tareKinds:
        euro: 25
        industrial: 30
    materials:
        - {key: polvereDiVetro, label: Polvere di vetro}
        - {key: granellaDiVetro, label: Granella di vetro}
        - {key: granellaDiVetro2, label: Granella di vetro 2}
        - {key: polvereDiSilicio, label: Polvere di silicio}
        - {key: plastica, label: Plastica}
        - {key: alluminio, label: Alluminio}
        - {key: sopravaglio, label: Sopravaglio}
        - {key: polvereDiAspirazione, label: Polvere di aspirazione}
steps:
    intake:
        repeatable: true
        startLabel: Nuovo camion
        instanceId: $truck.id
        label: $truck.id
        substeps:
            - id: truckArrive
              roles: [administration]
              schema:
                type: object
                required: [date, turno, truckWeight]
                properties:
                    date:
                        type: string
                        format: date
                        title: Data
                        default: $today
                    turno:
                        type: string
                        title: Turno
                        enum: [1st, 2nd, 3rd, whole-day]
                    truckWeight: {type: number, exclusiveMinimum: 0, title: Peso lordo camion}
              uiSchema:
                ui:options:
                    order: [date, turno, truckWeight]
                turno:
                    ui:options:
                        enumNames: ['1°', '2°', '3°', 'giornata intera']
              onSubmit:
                transform:
                    - op: mint
                      entity: truck
                      as: truck
                      id: >-
                        $substring($replace($.date, '-', ''), 2) & '-' & $.turno & '-' & $string($count($filter($domain.truck.*, function($v){$v.date = $.date and $v.turno = $.turno})) + 1)
                      set:
                        date: $.date
                        turno: $.turno
                        truckWeight: $.truckWeight
                        lastScaleReading: $.truckWeight
            - id: lots
              kind: group
              repeatable: true
              startLabel: Nuovo lotto
              closeLabel: Chiudi scarico
              instanceLabelEntity: load
              closeRequiresChildSubmission: true
              substeps:
                - id: register
                  roles: [administration]
                  schema:
                    type: object
                    required: [client, numeroFir, palletCount, truckWeightAfter]
                    properties:
                        client:
                            type: string
                            title: Cliente
                            enum: [NO, SU]
                        wasteCode:
                            type: string
                            title: Codice CER
                            enum: ['150101', '150102', '150103', '150104', '191201', '191204', '191212']
                        numeroFir: {type: string, minLength: 1, title: Numero FIR}
                        palletCount: {type: integer, minimum: 1, title: Numero di bancali}
                        truckWeightAfter: {type: number, exclusiveMinimum: 0, title: Peso camion dopo scarico}
                        notes: {type: string, title: Note}
                  uiSchema:
                    ui:options:
                        order: [client, wasteCode, numeroFir, palletCount, truckWeightAfter, notes]
                    client:
                        ui:options:
                            enumNames: [Nord, Sud]
                    wasteCode:
                        ui:options:
                            enumNames: ['15 01 01 — Imballaggi in carta e cartone', '15 01 02 — Imballaggi in plastica', '15 01 03 — Imballaggi in legno', '15 01 04 — Imballaggi metallici', '19 12 01 — Carta e cartone', '19 12 04 — Plastica e gomma', '19 12 12 — Altri rifiuti da trattamento meccanico']
                  chrome:
                    progressiveNumber:
                        kind: readonly
                        title: Progressivo cliente
                        after: client
                        expr: >-
                            (
                              $truck := $lookup($domain.truck, $instance.id);
                              $count($filter($domain.load.*, function($v){$v.client = $.client and $lookup($domain.truck, $v.truckId).date = $truck.date})) + 1
                            )
                    lotNetWeight:
                        kind: readonly
                        title: Peso netto lotto
                        after: truckWeightAfter
                        expr: >-
                            (
                              $prev := $lookup($domain.truck, $instance.id).lastScaleReading;
                              $type($prev) = 'number' and $type($.truckWeightAfter) = 'number' ? $prev - $.truckWeightAfter : null
                            )
                  onSubmit:
                    transform:
                        - op: mint
                          entity: load
                          as: load
                          id: >-
                            (
                              $truck := $lookup($domain.truck, $instance.id);
                              $n := $count($filter($domain.load.*, function($v){$v.client = $.client and $lookup($domain.truck, $v.truckId).date = $truck.date})) + 1;
                              $.client & '-' & $substring($replace($truck.date, '-', ''), 2) & '-' & $string($n)
                            )
                          set:
                            client: $.client
                            clientProgressive: >-
                              (
                                $truck := $lookup($domain.truck, $instance.id);
                                $count($filter($domain.load.*, function($v){$v.client = $.client and $lookup($domain.truck, $v.truckId).date = $truck.date})) + 1
                              )
                            numeroFir: $.numeroFir
                            wasteCode: $.wasteCode
                            palletCount: $.palletCount
                            truckId: $instance.id
                            notes: $.notes
                            netWeight: >-
                              $lookup($domain.truck, $instance.id).lastScaleReading - $.truckWeightAfter
                        - op: mintMany
                          entity: pallet
                          count: $.palletCount
                          id: "$load.id & '.' & $string($index + 1)"
                          set:
                            loadId: $load.id
                        - op: patch
                          entity: truck
                          id: $instance.id
                          set:
                            lastScaleReading: $.truckWeightAfter
                    http:
                        - method: '"POST"'
                          url: '"/fake/labels"'
                          label: '"Stampa etichette"'
                          action: link
                          body: >-
                            {

                              "loadId": $load.id,
                              "numeroFir": $.numeroFir,
                              "palletCount": $.palletCount,
                              "labels": $each(
                                $sift($domain.pallet, function($v){$v.loadId = $load.id}),
                                function($v, $k){{ "id": $k, "client": $.client }}
                              )
                            }
                        - method: '"POST"'
                          url: '"/fake/register-csv"'
                          label: '"Scarica CSV registrazione"'
                          action: download
                          body: >-
                            {

                              "client": $.client,
                              "numeroFir": $.numeroFir,
                              "palletCount": $.palletCount,
                              "truckWeightAfter": $.truckWeightAfter,
                              "netWeight": $load.netWeight,
                              "notes": $.notes,
                              "loadId": $load.id,
                              "truckId": $instance.id,
                              "palletIds": $each(
                                $sift($domain.pallet, function($v){$v.loadId = $load.id}),
                                function($v, $k){$k}
                              )
                            }
            - id: weightCheck
              roles: [administration]
              schema:
                type: object
                title: Controllo camion vs lotti
                required: [checkedTruckWeight, checkedLotSum]
                properties:
                    checkedTruckWeight: {type: number, exclusiveMinimum: 0, title: Peso camion verificato}
                    checkedLotSum: {type: number, exclusiveMinimum: 0, title: Somma pesi netti lotti verificata}
              uiSchema:
                ui:options:
                    order: [checkedTruckWeight, checkedLotSum]
              chrome:
                registeredData:
                    kind: dataReport
                    title: Dati registrati
                    before: checkedTruckWeight
                    expr: |-
                        (
                          $truck := $lookup($domain.truck, $instance.id);
                          $gross := $truck.truckWeight;
                          $lotSum := $sum($append([], $domain.load.*[truckId=$instance.id].netWeight));
                          $tare := $truck.lastScaleReading;
                          $m := $max([$gross - $tare, $lotSum]);
                          $pct := $m = 0 ? 0 : 100 * $min([$gross - $tare, $lotSum]) / $m;
                          $tone := $pct >= 98 ? "green" : $pct >= 90 ? "warning" : "danger";
                          $kg := function($v){ $type($v) = "number" ? $string($v) : null };
                          {
                            "value": null,
                            "error": null,
                            "rows": [
                              {"label": "Peso lordo camion", "value": $kg($gross), "error": null, "tone": null},
                              {"label": "Ultima lettura (tara)", "value": $kg($tare), "error": null, "tone": null},
                              {"label": "Σ netti lotti", "value": $kg($lotSum), "error": null, "tone": null},
                              {"label": "Match %", "value": $string($pct), "error": null, "tone": $tone}
                            ]
                          }
                        )
                currentOperator:
                    kind: readonly
                    title: Operatore corrente
                    expr: $operator.displayName
                    after: checkedLotSum
              onSubmit:
                transform:
                    - op: patch
                      entity: truck
                      id: '$instance.id'
                      set:
                        checkedTruckWeight: $.checkedTruckWeight
                        checkedLotSum: $.checkedLotSum
    line:
        repeatable: true
        startLabel: Nuovo turno
        # Job-start leaf: engine cannot mint a Job instance from a group-first Commit.
        instanceId: $.date & '-' & $.turno
        label: "'Turno: ' & $.date & ' ' & $lookup($catalogs.turni, $.turno)"
        substeps:
            - id: openTurno
              roles: [line]
              schema:
                type: object
                title: Apri turno
                required: [date, turno]
                properties:
                    date:
                        type: string
                        format: date
                        title: Data
                        default: $today
                    turno:
                        type: string
                        title: Turno
                        enum: [1st, 2nd, 3rd, whole-day]
              uiSchema:
                ui:options:
                    order: [date, turno]
                turno:
                    ui:options:
                        enumNames: ['1°', '2°', '3°', 'giornata intera']
              onSubmit:
                transform: []
            - id: palletWeight
              kind: group
              repeatable: true
              startLabel: Nuova pesata
              closeLabel: Chiudi pesatura
              substeps:
                - id: weigh
                  roles: [logistic]
                  derived:
                    "weights.*.panelCount":
                        overridable: true
                        expr: >
                            (

                              $avg := $data.averagePanelWeight;
                              $row := $lookup($data.weights, "__ROW_ID__");
                              $kind := $exists($row.tareKind) ? $row.tareKind : $data.tareKind;
                              $tare := $kind = 'custom'
                                ? $data.customTareWeight
                                : $lookup($catalogs.tareKinds, $kind);
                              $w := $row.weight;
                              $avg > 0 and $type($tare) = 'number' and $type($w) = 'number'
                                ? $floor(($w - $tare) / $avg)
                                : undefined
                            )

                  dynamicProperties:
                    weights:
                        read: rows
                  reads:
                    rows:
                        entity: pallet
                        where: $not($exists(weight))
                        key: id
                  schema:
                    type: object
                    title: Pesi bancali
                    required: [averagePanelWeight, tareKind, weights]
                    properties:
                        averagePanelWeight:
                            type: number
                            exclusiveMinimum: 0
                            title: Peso medio pannello (kg)
                        tareKind:
                            type: string
                            title: Tara (default nuove righe)
                            enum: [euro, industrial, custom]
                        customTareWeight:
                            type: number
                            exclusiveMinimum: 0
                            title: Tara personalizzata (kg)
                        weights:
                            type: object
                            additionalProperties:
                                type: object
                                required: [weight]
                                properties:
                                    weight: {type: number, exclusiveMinimum: 0, title: Peso}
                                    tareKind:
                                        type: string
                                        title: Tara
                                        enum: [euro, industrial, custom]
                                    idoneita:
                                        type: string
                                        title: IR / NIR
                                        enum: [NIR, IR]
                                    panelCount: {type: number, title: Pannelli}
                  uiSchema:
                    ui:options:
                        order: [averagePanelWeight, tareKind, customTareWeight, weights]
                    tareKind:
                        ui:options:
                            enumNames: ['euro (25 kg)', 'industriale (30 kg)', 'personalizzata']
                    weights:
                        ui:field: mapTable
                        ui:options:
                            expandable: false
                            columns: {id: Bancale, value: Peso}
                        additionalProperties:
                            tareKind:
                                ui:options:
                                    enumNames: ['euro (25 kg)', 'industriale (30 kg)', 'personalizzata']
                            idoneita:
                                ui:options:
                                    enumNames: [NIR, IR]
                            panelCount:
                                ui:field: derivedLeaf
                  onSubmit:
                    transform:
                        - op: patchEach
                          entity: pallet
                          set:
                            weight: $value.weight
                            tareKind: $value.tareKind
                            idoneita: $value.idoneita
                            panelCount: $value.panelCount
            - id: lineLoad
              roles: [line]
              dynamicProperties:
                progress:
                    read: rows
              reads:
                rows:
                    entity: pallet
                    where: $exists(weight) and $not(progress = 'done')
                    key: id
              schema:
                type: object
                title: Segna avanzamento
                properties:
                    progress:
                        type: object
                        additionalProperties:
                            enum: [partial, done]
              uiSchema:
                progress:
                    ui:field: mapTable
                    ui:options:
                        expandable: false
                        columns: {id: Bancale, value: Avanzamento}
                    additionalProperties:
                        ui:options:
                            enumNames: [Parziale, Fatto]
                            # U+2013 — empty / stock-clearable trigger; Go expands to shadcn4*
                            placeholder: –
              onSubmit:
                transform:
                    - op: patchEach
                      entity: pallet
                      set:
                        progress: $value
            - id: containerReg
              roles: [logistic]
              enumReads:
                sourceLoadId: loads
                secondarySourceLoadId: loads
              reads:
                loads:
                    entity: load
                    key: id
              schema:
                type: object
                title: Registrazione contenitori
                required: [sourceLoadId]
                properties:
                    sourceLoadId:
                        type: string
                        title: Carico sorgente
                    secondarySourceLoadId:
                        type: string
                        title: Carico sorgente secondario
                        minLength: 1
                        pattern: '.*\S.*'
                        not:
                            const:
                                $data: '/sourceLoadId'
                    polvereDiVetro:
                        type: array
                        title: Polvere di vetro
                        items: &containerWeightRow
                            type: object
                            required: [weight]
                            properties:
                                weight: {type: number, exclusiveMinimum: 0, title: Peso}
                                dualSources:
                                    type: boolean
                                    title: Fonti doppie
                                    default: false
                    granellaDiVetro:
                        type: array
                        title: Granella di vetro
                        items: *containerWeightRow
                    granellaDiVetro2:
                        type: array
                        title: Granella di vetro 2
                        items: *containerWeightRow
                    polvereDiSilicio:
                        type: array
                        title: Polvere di silicio
                        items: *containerWeightRow
                    plastica:
                        type: array
                        title: Plastica
                        items: *containerWeightRow
                    alluminio:
                        type: array
                        title: Alluminio
                        items: *containerWeightRow
                    sopravaglio:
                        type: array
                        title: Sopravaglio
                        items: *containerWeightRow
                    polvereDiAspirazione:
                        type: array
                        title: Polvere di aspirazione
                        items: *containerWeightRow
                if:
                    anyOf:
                        - required: [polvereDiVetro]
                          properties:
                            polvereDiVetro:
                                contains: &dualContains
                                    properties:
                                        dualSources: {const: true}
                                    required: [dualSources]
                        - required: [granellaDiVetro]
                          properties:
                            granellaDiVetro:
                                contains: *dualContains
                        - required: [granellaDiVetro2]
                          properties:
                            granellaDiVetro2:
                                contains: *dualContains
                        - required: [polvereDiSilicio]
                          properties:
                            polvereDiSilicio:
                                contains: *dualContains
                        - required: [plastica]
                          properties:
                            plastica:
                                contains: *dualContains
                        - required: [alluminio]
                          properties:
                            alluminio:
                                contains: *dualContains
                        - required: [sopravaglio]
                          properties:
                            sopravaglio:
                                contains: *dualContains
                        - required: [polvereDiAspirazione]
                          properties:
                            polvereDiAspirazione:
                                contains: *dualContains
                then:
                    required: [secondarySourceLoadId]
              uiSchema:
                ui:options:
                    order: [sourceLoadId, secondarySourceLoadId, polvereDiVetro, granellaDiVetro, granellaDiVetro2, polvereDiSilicio, plastica, alluminio, sopravaglio, polvereDiAspirazione]
                sourceLoadId:
                    ui:components:
                        stringField: enumField
                secondarySourceLoadId:
                    ui:components:
                        stringField: enumField
                polvereDiVetro: &containerRegMaterialArrayUi
                    ui:components:
                        arrayItemField: compactArrayItemField
                    ui:options:
                        orderable: false
                        copyable: false
                        layouts:
                            array-field:
                                class: 'gap-0 has-[[data-layout=array-items]>*]:gap-2 [&>button]:w-auto [&>button]:self-start has-[[data-layout=array-items]>*]:[&_[data-layout=array-field-title-row]]:mb-3'
                            array-items:
                                class: gap-1
                            array-field-title-row:
                                variant: label
                                class: mb-1
                    items:
                        ui:options:
                            hideTitle: true
                            order: [weight, dualSources]
                            layouts:
                                object-properties:
                                    class: flex w-full flex-row flex-nowrap items-stretch gap-2
                        weight:
                            ui:options:
                                hideTitle: true
                        dualSources:
                            ui:components:
                                booleanField: checkboxOnlyField
                granellaDiVetro: *containerRegMaterialArrayUi
                granellaDiVetro2: *containerRegMaterialArrayUi
                polvereDiSilicio: *containerRegMaterialArrayUi
                plastica: *containerRegMaterialArrayUi
                alluminio: *containerRegMaterialArrayUi
                sopravaglio: *containerRegMaterialArrayUi
                polvereDiAspirazione: *containerRegMaterialArrayUi
              onSubmit:
                transform:
                    - op: bind
                      expr: >-
                        (
                          $rows := $reduce($catalogs.materials, function($acc, $m){(
                            $arr := $lookup($, $m.key) ? $lookup($, $m.key) : [];
                            $type($arr) != "array" ? $acc : $append($acc, $map(
                              $arr[$type(weight)="number" and weight > 0],
                              function($r){
                                $merge([
                                  {"weight": $r.weight, "material": $m.label},
                                  $r.dualSources = true ? {"secondarySourceLoadId": secondarySourceLoadId} : {}
                                ])
                              }
                            ))
                          )}, []);
                          {"sourceLoadId": sourceLoadId, "rows": $rows}
                        )
                    - op: mintMany
                      entity: container
                      count: $count($.rows)
                      id: "'C-' & $string($count($domain.container.*) + 1)"
                      set:
                        weight: $.rows[$index].weight
                        material: $.rows[$index].material
                        sourceLoadId: $.sourceLoadId
                        secondarySourceLoadId: $.rows[$index].secondarySourceLoadId
            - id: loadedExtracted
              roles: [administration]
              schema:
                type: object
                title: Controllo caricato vs estratto
                required: [checkedLoadedWeight, checkedContainerSum]
                properties:
                    checkedLoadedWeight: {type: number, exclusiveMinimum: 0, title: Peso caricato verificato}
                    checkedContainerSum: {type: number, exclusiveMinimum: 0, title: Somma pesi contenitori verificata}
              uiSchema:
                ui:options:
                    order: [checkedLoadedWeight, checkedContainerSum]
              chrome:
                resultsReport:
                    kind: dataReport
                    title: Risultati finali
                    before: checkedLoadedWeight
                    expr: |-
                        (
                          $tareKinds := $catalogs.tareKinds;
                          $materials := $catalogs.materials;
                          $materialKeys := $map($materials, function($m){$m.key});
                          $safeSum := function($arr){ $reduce($arr ? $arr : [], function($a,$b){$a+$b}, 0) };
                          $num := function($v){ $type($v) = "number" ? $v : undefined };
                          $str := function($v){ $type($v) = "string" and $length($trim($v)) > 0 ? $trim($v) : undefined };
                          $matchPct := function($a,$b){ ($m := $max([$a,$b]); $m = 0 ? 0 : 100 * $min([$a,$b]) / $m) };
                          $matchTone := function($pct){ $pct >= 98 ? "green" : $pct >= 90 ? "warning" : "danger" };
                          $kgRow := function($label,$v){ {"label": $label, "value": $type($v)="number" ? $string($v) : null, "error": null, "tone": null} };
                          $resolveTare := function($facts){(
                            $kind := $str($facts.tareKind);
                            $type($kind) = "string" ? ($kind = "custom" ? $num($facts.customTareWeight) : $num($lookup($tareKinds, $kind))) : undefined
                          )};
                          $weighCount := function($facts){(
                            $w := $facts.weights;
                            $type($w) = "object" ? $count($keys($w)) : 0
                          )};
                          $sumPallet := function($loadId, $doneOnly){(
                            $vals := $domain.pallet.*[loadId=$loadId][$doneOnly ? progress="done" : true].weight[$type($)="number"];
                            $safeSum($vals)
                          )};
                          $totalTare := function($loadId){(
                            $subs := $append([], $domain.submissions[taskId="weigh"]);
                            $count($subs)=0 ? 0 : $safeSum($map($subs, function($s){(
                              $facts := $s.facts;
                              $type($facts.weights) = "object" ? (
                                $t := $resolveTare($facts);
                                $type($t) = "number" ? $t * $weighCount($facts) : 0
                              ) : (
                                $rows := $append([], $facts.*[$type($) = "object"]);
                                $count($rows)=0 ? 0 : $safeSum($map($rows, function($r){(
                                  $t := $resolveTare($r);
                                  $type($t) = "number" ? $t : 0
                                )}))
                              )
                            )}))
                          )};
                          $secondaries := function($loadId){(
                            $ids := $append([], $domain.container.*[sourceLoadId=$loadId].secondarySourceLoadId[$type($)="string" and $length($trim($))>0 and $trim($) != $loadId].$trim($));
                            $count($ids)=0 ? [] : $distinct($ids)
                          )};
                          $extractedRows := function($loadId){(
                            $conts := $append([], $domain.container.*[sourceLoadId=$loadId][$type(weight)="number"]);
                            $keysPresent := $distinct($append([], $map($conts, function($r){ $str($r.material) ? $str($r.material) : "" })));
                            $weightFor := function($k){ $safeSum($conts[($str(material) ? $str(material) : "") = $k].weight) };
                            $knownIds := $append($materialKeys, $map($materials, function($m){$m.label}));
                            $knownRaw := $map($materials, function($m){(
                              $byKey := $count($keysPresent[$ = $m.key]) > 0;
                              $byLabel := $count($keysPresent[$ = $m.label]) > 0;
                              $byKey or $byLabel ? {"material": $m.key, "label": $m.label, "weightKg": $byKey ? $weightFor($m.key) : $weightFor($m.label)} : undefined
                            )});
                            $known := $append([], $knownRaw[$exists(material)]);
                            $extras := $sort($filter($keysPresent, function($k){ $count($knownIds[$ = $k]) = 0 }));
                            $extraRows := $count($extras)=0 ? [] : $map($extras, function($k){{"material": $k, "label": $k, "weightKg": $weightFor($k)}});
                            $append($known, $extraRows)
                          )};
                          $section := function($loadId){(
                            $load := $lookup($domain.load, $loadId);
                            $netLot := $num($load.netWeight);
                            $grossPallet := $sumPallet($loadId, false);
                            $actualPallet := $sumPallet($loadId, true);
                            $palletTare := $totalTare($loadId);
                            $netPanels := $grossPallet - $palletTare;
                            $matRows := $extractedRows($loadId);
                            $totalExtracted := $safeSum($map($matRows, function($r){$r.weightKg}));
                            $delta := $netPanels - $totalExtracted;
                            $pct := $matchPct($netPanels, $totalExtracted);
                            $rows := $append(
                              [
                                $kgRow("Netto lotto", $netLot),
                                $kgRow("Σ bancali lordi", $grossPallet),
                                $kgRow("Σ bancali effettivi (fatti)", $actualPallet),
                                $kgRow("Tara totale bancali", $palletTare),
                                $kgRow("Massa netta pannelli", $netPanels)
                              ],
                              $append(
                                $count($matRows)=0 ? [] : $map($matRows, function($r){{"label": $r.label, "value": $string($r.weightKg), "error": null, "tone": "info"}}),
                                [
                                  $kgRow("Totale estratto", $totalExtracted),
                                  {"label": "Pannelli vs estratto", "value": $string($delta) & " kg (" & $string($pct) & "%)", "error": null, "tone": $matchTone($pct)}
                                ]
                              )
                            );
                            {
                              "id": $loadId,
                              "secondaryIds": $secondaries($loadId),
                              "rows": $rows
                            }
                          )};
                          $count($keys($domain.container))=0 ? {
                            "value": null,
                            "error": null,
                            "sections": []
                          } : (
                            $primaryIds := $sort($distinct($append([], $domain.container.*.sourceLoadId[$type($)="string" and $length($trim($))>0].$trim($))));
                            {
                              "value": null,
                              "error": null,
                              "sections": $count($primaryIds)=0 ? [] : $map($primaryIds, function($id){$section($id)})
                            }
                          )
                        )
              onSubmit:
                transform: []
