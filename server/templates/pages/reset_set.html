{{/* Used on /reset/.Token to render password reset form (NOT USED YET!) */}}

{{ define "reset_set_body" }}
  <div class="login-wrapper">
    <section class="panel login">
      <div class="panel-heading">
        <h1>{{ .Title }}</h1>
      </div>
      <form method="post" action="/reset/{{ .Token }}" class="input-form">
        <div class="form-field">
          <label class="muted" for="password">New password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" required />
            <button
              type="button"
              class="toggle-password"
              data-target="password"
              aria-label="Toggle new password visibility"
            >
              {{ template "icon-eye" . }}
              {{ template "icon-eye-off" . }}
            </button>
          </div>
        </div>
        <div class="form-field">
          <label for="confirm-password">Confirm password</label>
          <div class="password-field">
            <input
              id="confirm-password"
              name="confirm_password"
              type="password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              data-target="confirm-password"
              aria-label="Toggle confirm password visibility"
            >
              {{ template "icon-eye" . }}
              {{ template "icon-eye-off" . }}
            </button>
          </div>
        </div>
        {{ if .Error }}
          <p class="error">{{ .Error }}</p>
        {{ end }}
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">{{ .SubmitLabel }}</button>
        </div>
      </form>
    </section>
  </div>
  {{ template "toggle_password_script" . }}
{{ end }}

{{ define "reset_set.html" }}
  {{ template "layout.html" . }}
{{ end }}
