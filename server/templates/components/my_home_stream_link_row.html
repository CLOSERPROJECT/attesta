{{/* Stacked attention/upcoming link row: title + muted workflow/meta. */}}
{{ define "my_home_stream_link_row" }}
  <li>
    <a class="list-row" href="{{ .Href }}">
      <div class="list-row-main list-row-main-stack">
        <p>{{ .Title }}</p>
        <p class="muted u-text-xs">
          {{ .WorkflowName }}
          {{ if .Meta }}· {{ .Meta }}{{ end }}
        </p>
      </div>
    </a>
  </li>
{{ end }}
